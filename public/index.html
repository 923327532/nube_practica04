<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema ONPE Real</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 400px; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-blue { background: #193d7a; color: white; }
        .btn-orange { background: #ff9800; color: white; }
        .btn-green { background: #28a745; color: white; }
        #status { margin-top: 15px; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center;">Consulta Masiva ONPE</h2>
        <input type="text" id="dni" placeholder="DNI Individual" style="width: 94%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
        <button class="btn-blue" onclick="consultar()">CONSULTAR DNI</button>
        <hr>
        <button class="btn-orange" onclick="procesar()">PROCESAR LISTA EXCEL (10 DNIs)</button>
        <button class="btn-green" onclick="location.href='/api/excel'">DESCARGAR EXCEL RESULTADOS</button>
        <div id="status"></div>
    </div>

    <script>
        async function consultar() {
            const dni = document.getElementById('dni').value;
            const status = document.getElementById('status');
            status.innerHTML = "Buscando...";
            const r = await fetch('/api/consultar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({dni})
            });
            const data = await r.json();
            status.innerHTML = data.error ? data.error : `Encontrado: ${data.nombres} ${data.apellidos}`;
        }

        async function procesar() {
            const status = document.getElementById('status');
            status.innerHTML = "Consultando lista real a la ONPE... espera.";
            const r = await fetch('/api/procesar-lista');
            const data = await r.json();
            status.innerHTML = data.success ? `¡Listo! ${data.cantidad} DNIs procesados.` : "Error en el proceso.";
        }
    </script>
</body>
</html>
